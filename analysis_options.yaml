# Static analysis configuration.
#
# `flutter analyze` uses this file. Note that the custom_lint plugin registered
# below (which is what activates riverpod_lint) is NOT run by `flutter analyze`
# — run `dart run custom_lint` for those rules, or rely on the IDE.

include: package:flutter_lints/flutter.yaml

linter:
  rules:
    # Suppress a rule for a single line with `// ignore: name_of_lint`, or for a
    # whole file with `// ignore_for_file: name_of_lint`, rather than disabling
    # it project-wide here.

analyzer:
  # Written by `flutter analyze` itself on every run. Committed so a command
  # that is supposed to be read-only stops dirtying the working tree.
  exclude:
    - build/**
    - android/**
    - ios/**

  errors:
    # `plugins:` below is the legacy registration, and Dart now warns on it.
    # That warning is the only thing `flutter analyze` reports on this project
    # and it makes the command exit 1, so CI's analyze gate cannot pass while
    # it is live.
    #
    # Suppressed rather than fixed, because the fix is not ours to make:
    # custom_lint 0.8 registers through the legacy system and offers no
    # new-style entry point to move to. Delete this line the moment it does.
    # See https://dart.dev/tools/analyzer-plugins.
    analysis_options_deprecated_plugins: ignore

  plugins:
    - custom_lint
