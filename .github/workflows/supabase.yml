name: Supabase CI

# Split from flutter.yml rather than added to it, and path-filtered: this job
# pulls the whole local Supabase stack in Docker, which is minutes the Dart
# gates should not have to wait behind on a branch that touches no SQL.
on:
  pull_request:
    branches: [develop, main]
    paths:
      - 'supabase/**'
      - 'scripts/supabase-verify.sh'
      - '.github/workflows/supabase.yml'
  push:
    branches: [develop, main]
    paths:
      - 'supabase/**'
      - 'scripts/supabase-verify.sh'
      - '.github/workflows/supabase.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The job checks out and runs containers; it writes nothing back. On a public
# repo the default token is worth narrowing, because `supabase start` hands the
# environment to every image it pulls.
permissions:
  contents: read

jobs:
  backend:
    name: Migrations, RLS & delete-account
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # Pinned rather than `latest`: the CLI ships the Postgres image and
          # the config.toml schema together, so an unpinned bump can fail a
          # branch that changed nothing. Raise it deliberately.
          version: 2.105.0

      # Studio and the mail catcher are excluded because nothing here opens
      # either: the verify script creates its test user pre-confirmed through
      # the admin API, so no confirmation mail is ever fished out of inbucket.
      # That is several hundred MB of image pulls off the required path.
      - name: Start the local stack
        run: supabase start -x studio,inbucket

      # --no-reset because `supabase start` on a fresh runner has already
      # applied every migration from scratch; the default reset would drop the
      # database and do that same work a second time before the deliberate
      # re-runnability pass. Every guarantee survives — from-scratch apply
      # (start), second apply (the script), pgTAP, delete-account end to end.
      # The reset default stays right for a developer with a dirty local
      # database, which a fresh runner never has.
      - name: Verify the backend
        run: scripts/supabase-verify.sh --no-reset

      - name: Container logs on failure
        if: failure()
        run: supabase status || docker ps -a
