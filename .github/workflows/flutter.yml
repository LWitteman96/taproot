name: Flutter CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

# Cancel superseded runs on the same branch/PR so a new push doesn't wait behind
# an outdated one (and to save CI minutes).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Analyze & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # .env.* are gitignored secret files that are declared as assets in
      # pubspec.yaml. Nothing in CI reads them, but `flutter analyze` verifies
      # that declared assets exist, so create empty placeholders.
      - name: Create placeholder env files
        run: touch .env.dev .env.stg .env.prod

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze project source
        run: flutter analyze

      - name: Run tests
        run: flutter test

  text-encoding:
    name: Source is text
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # A single stray NUL byte turns a source file binary to every tool that
      # reads it by content rather than by extension: git renders it as
      # `Bin 2807 -> 3382 bytes` instead of a diff, so it appears in no PR view
      # and no blame, and `git grep -I` skips it — which silently exempts it
      # from the secret scan in this same workflow.
      #
      # `lib/app/sync/sync_tables.dart` was exactly that for a whole branch:
      # 81 lines defining every table sync touches, reviewed by nobody, because
      # `keyOf` joined on a literal NUL instead of the `\u0000` escape. Neither
      # `dart format` nor `flutter analyze` minds — both parse it happily — so
      # nothing in the pipeline had an opinion. This is the job that does.
      #
      # `.gitattributes` fixes how such a file *displays*; only this stops one
      # being committed.
      # Same argument as the secret scan's self-test: show the check can fail
      # before trusting it when it passes. A gate that has never been seen to
      # catch anything is a statement of belief.
      - name: Check the text gate can detect a binary file
        run: |
          scratch="$(mktemp -d)"
          printf 'a\000b' > "$scratch/planted.dart"
          printf 'plain text\n' > "$scratch/clean.dart"
          if LC_ALL=C tr -d '\000' < "$scratch/planted.dart" | cmp -s - "$scratch/planted.dart"; then
            echo "::error::The text gate does not detect a NUL byte. It would pass every file regardless."
            exit 1
          fi
          if ! LC_ALL=C tr -d '\000' < "$scratch/clean.dart" | cmp -s - "$scratch/clean.dart"; then
            echo "::error::The text gate flags a plain text file. It would fail every build."
            exit 1
          fi
          rm -rf "$scratch"
          echo "The text gate detects a NUL byte and leaves text alone."

      # `LC_ALL=C` so `tr` treats bytes as bytes. Without it, BSD `tr` aborts
      # with "Illegal byte sequence" on content that is not valid UTF-8 — which
      # is most binary files, and is what the pre-commit hook meets on macOS.
      # The check still reached the right answer through the error, by accident
      # rather than by design.
      - name: Fail if a source file is not text
        run: |
          offenders=""
          for f in $(git ls-files -- lib test); do
            [ -f "$f" ] || continue
            if ! LC_ALL=C tr -d '\000' < "$f" | cmp -s - "$f"; then
              offenders="$offenders $f"
            fi
          done
          if [ -n "$offenders" ]; then
            echo "::error::A source file under lib/ or test/ contains a NUL byte, which makes it binary to git and to grep:$offenders"
            echo "Write the byte as an escape (\u0000) rather than as a literal."
            exit 1
          fi
          echo "Every tracked source file under lib/ and test/ is text."

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest

    # Defined once, at job level, so the self-test below and the scan itself
    # cannot drift apart. A self-test with its own copy of the pattern proves
    # only that the copy works.
    env:
      CREDENTIAL_PATTERN: 'eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}|-----BEGIN [A-Z ]*PRIVATE KEY-----|AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9]{36}|sk-[A-Za-z0-9]{32,}'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # This repository is public, so a credential committed even once is
      # compromised — the object stays in history and is indexed within minutes.
      # Deliberately dependency-free and narrowly targeted: broad entropy rules
      # produce false positives (Flutter's own commit SHAs in .metadata) that
      # train people to ignore the job.
      - name: Fail if a credential file is tracked
        run: |
          if git ls-files --error-unmatch \
              '.env' '.env.*' '.secrets/*' \
              'android/key.properties' \
              '**/google-services.json' '**/GoogleService-Info.plist' \
              'sentry.properties' 2>/dev/null | grep .; then
            echo "::error::A credential file is tracked in git. Remove it and add it to .gitignore."
            exit 1
          fi
          echo "No credential files tracked."

      # Proves the scan can do the thing it exists to do, before trusting it to
      # say the repository is clean.
      #
      # This is not ceremony. Until this commit the scan below carried `-I`,
      # which skips binary files, so a credential committed inside any blob git
      # classifies as binary was invisible to it — on a public repository, where
      # a secret committed once is compromised even after it is removed. It had
      # been that way since the job was written and nothing could have told us,
      # because a scan that finds nothing looks identical whether it is clean or
      # blind.
      #
      # The locale line is the other half, and it is the half that reasoning
      # alone does not reach. Dropping `-I` is not enough: under a UTF-8 locale
      # the regex engine gives up on content containing invalid UTF-8 — a PNG
      # header is 0x89 'PNG', which is not valid UTF-8 — so the pattern never
      # matches however the binary flags are set. Measured, on the real pattern:
      #
      #     git grep -nIE  → missed        LC_ALL=C           → found
      #     git grep -nE   → missed        LC_ALL=C.UTF-8     → missed
      #     git grep -naE  → missed        LC_ALL=en_US.UTF-8 → missed
      #
      # A fixed-string search found it every time, which is what made the regex
      # the suspect. `LC_ALL=C` makes the engine compare bytes as bytes; the
      # patterns are all ASCII, so nothing is lost by it.
      - name: Check the scan can see inside a binary file
        run: |
          scratch="$(mktemp -d)"
          git init -q "$scratch"
          # A PNG header with a fake AWS key id planted after a NUL.
          #
          # The 0xFF 0xFE **on the same line as the credential** is load-bearing
          # and was missing from the first version of this step. git grep splits
          # on newlines first, and the PNG's own CRLF pushes the credential onto
          # a later line — so a plant whose bytes are all valid UTF-8 from that
          # newline onward matches under every locale, and the step would go
          # green with LC_ALL=C removed. An invalid byte anywhere on the line
          # breaks matching for the whole line, which is what this has to
          # reproduce. Verified: this plant is found by the invocation below,
          # and missed both with `-I` restored and under LC_ALL=C.UTF-8.
          printf '\211PNG\015\012\032\012\000\000\000\015IHDR\377\376\000AKIAABCDEFGHIJKLMNOP\000\000' \
            > "$scratch/planted.png"
          git -C "$scratch" add -A
          git -C "$scratch" -c user.email=ci@example.invalid -c user.name=ci \
            commit -qm planted
          if LC_ALL=C git -C "$scratch" grep -nE "$CREDENTIAL_PATTERN" -- . >/dev/null; then
            echo "The scan sees credentials inside binary files."
          else
            echo "::error::The secret scan cannot see inside binary files. It would report this repository clean without having looked at every blob. Check the -I flag and LC_ALL on the step below."
            exit 1
          fi
          rm -rf "$scratch"

      # No `-I`, so binary blobs are searched too, and `LC_ALL=C` so the regex
      # actually matches inside them. Verified in both directions: the step
      # above proves it catches a planted credential, and this one is known to
      # produce no false positives across this repository's ~70 tracked binaries
      # (the app-icon PNGs). One scan rather than a separate binary sweep —
      # fewer moving parts to keep correct.
      - name: Fail if a credential-shaped string is committed
        run: |
          if LC_ALL=C git grep -nE "$CREDENTIAL_PATTERN" \
              -- . ':(exclude)pubspec.lock' ':(exclude).github/workflows/*'; then
            echo "::error::A credential-shaped string is committed. Rotate it, then remove it."
            exit 1
          fi
          echo "No credential-shaped strings found."
