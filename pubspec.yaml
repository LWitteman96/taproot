name: taproot
description: "Taproot — design your habits, not just track them"
# Prevents accidental publication to pub.dev.
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State — Riverpod 3, hand-written, no code generation (guide §5).
  riverpod: ^3.0.3
  flutter_riverpod: ^3.0.3

  # Routing
  go_router: ^17.0.1

  # Backend
  supabase_flutter: ^2.5.4

  # Local-first store (guide §8) — SQLite is the primary store, not a cache.
  sqflite: ^2.4.2
  shared_preferences: ^2.5.2

  # Connectivity drives the sync trigger.
  connectivity_plus: ^7.0.0

  # Observability
  sentry_flutter: ^9.7.0
  logging: ^1.2.0

  # Per-flavor environment files (guide §3).
  flutter_dotenv: ^6.0.0

  # Auth — Apple sign-in is mandatory alongside Google on iOS.
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^7.0.1

  # Generic plumbing
  uuid: ^4.5.3
  crypto: ^3.0.6
  collection: ^1.19.0
  meta: ^1.16.0
  path: ^1.9.0
  path_provider: ^2.1.3
  url_launcher: ^6.3.1
  app_links: ^6.3.2
  device_info_plus: ^11.5.0
  http: ^1.2.2
  cupertino_icons: ^1.0.6

  # Plant art is expected to arrive as SVG (guide §1).
  flutter_svg: ^2.0.10+1
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  permission_handler: ^13.0.1
  flutter_animate: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Lint — custom_lint is what activates riverpod_lint.
  flutter_lints: ^5.0.0
  custom_lint: ^0.8.0
  riverpod_lint: ^3.0.3

  # Test harness (guide §10).
  mocktail: ^1.0.4
  mock_supabase_http_client: ^0.0.3+2
  sqflite_common_ffi: ^2.4.0+2

  # Native flavor config generation (guide §3).
  flutter_flavorizr: ^2.4.1

  # Uploads debug symbols / source maps to Sentry on release builds.
  sentry_dart_plugin: ^3.2.1

flutter:
  uses-material-design: true
  assets:
    # Gitignored but declared — CI touches these before `flutter analyze` (guide §3).
    - .env.dev
    - .env.stg
    - .env.prod

# Native flavor configuration. Regenerate with:
#   dart run flutter_flavorizr
#
# The instruction list is explicit and deliberately excludes the icon and
# flutter:* processors. Icons are skipped because the plant/app art is still with
# the external designer; the flutter:app / flutter:pages / flutter:main /
# flutter:flavors processors are skipped because they scaffold a demo app and
# would overwrite the hand-written entry points in lib/main_<flavor>.dart.
#
# Unlike inkBlox, the iOS bundle id and Android applicationId are kept identical
# per flavor rather than diverging into com.<app>.app / com.<app>.application.
flavorizr:
  ide: "vscode"
  instructions:
    - android:androidManifest
    - android:buildGradle
    - android:flavorizrGradle
    - android:label
    - ios:podfile
    - ios:xcconfig
    - ios:buildTargets
    - ios:schema
    - ios:plist
    - ide:config
  app:
    android:
      flavorDimensions: "flavor-type"

  flavors:
    dev:
      app:
        name: "Taproot Dev"
      android:
        applicationId: "com.taproot.app.dev"
      ios:
        bundleId: "com.taproot.app.dev"

    stg:
      app:
        name: "Taproot Stg"
      android:
        applicationId: "com.taproot.app.stg"
      ios:
        bundleId: "com.taproot.app.stg"

    prod:
      app:
        name: "Taproot"
      android:
        applicationId: "com.taproot.app"
      ios:
        bundleId: "com.taproot.app"
